# Nixpacks · Web Next.js (Dokploy)
# Seleccionar en la app: NIXPACKS_CONFIG_FILE=nixpacks.web.toml
# El puerto lo toma de PORT (3000 por defecto).

[phases.install]
cmds = ["pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @unior/web build"]

[start]
cmd = ["bash", "scripts/start-web.sh"]
