services:
  postgres:
    image: postgres:16-alpine
    container_name: unior-correspondencia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unior}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unior_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-correspondencia_unior}
      TZ: America/La_Paz
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-unior} -d ${POSTGRES_DB:-correspondencia_unior}',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
    name: unior_correspondencia_data
